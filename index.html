  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanta - Maintenance</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:linear-gradient(135deg,#0A1931,#1E3A8A,#F59E0B);min-height:100vh;display:flex;align-items:center;justify-content:center;color:white;font-family:'Segoe UI',sans-serif}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);border-radius:20px}
.coin{width:120px;height:120px;background:radial-gradient(circle at 30% 30%,#FBBF24,#2563EB);border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid #FBBF24;margin:0 auto;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.blue-v{font-size:60px;font-weight:900;animation:roll 2.5s linear infinite;display:inline-block}
@keyframes roll{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
</style>
</head>
<body>
<div class="glass p-8 text-center max-w-sm w-full mx-4">
  <div class="coin mb-5"><span class="blue-v">V</span></div>
  <h1 class="text-xl font-bold">Under Maintenance</h1>
  <p class="text-white/60 text-sm mt-2">We will be back soon.</p>
</div>
</body>
</html>
