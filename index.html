 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanta - Maintenance</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:linear-gradient(135deg,#0A1931 0%,#1E3A8A 25%,#2563EB 50%,#1E40AF 70%,#F59E0B 100%);background-attachment:fixed;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;padding:16px}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);border-radius:20px}
.coin{width:140px;height:140px;background:radial-gradient(circle at 30% 30%,#FBBF24,#F59E0B 20%,#2563EB 60%,#1E3A8A);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(245,158,11,.6),0 0 30px rgba(37,99,235,.6);border:4px solid #FBBF24;animation:coinFloat 3s ease-in-out infinite;margin:0 auto}
@keyframes coinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blue-v{color:#FFFFFF;font-size:64px;font-weight:900;display:inline-block;animation:vRoll 2.5s linear infinite}
@keyframes vRoll{0%{transform:rotateY(0deg)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
</style>
</head>
<body>
<div class="max-w-sm w-full">
  <div class="glass p-8 text-center">
    <div class="coin mb-6"><span class="blue-v">V</span></div>
    
    <h1 class="text-2xl font-black">VANTA</h1>
    <p class="text-yellow-300 font-bold tracking-[0.3em] text-xs mt-2">UNDER MAINTENANCE</p>
    
    <p class="text-white text-lg font-bold mt-6">We are upgrading the app</p>
    <p class="text-white/60 text-sm mt-3 leading-relaxed">
      We dey work to serve you better.<br>
      Your balance, verification & mining are 100% safe.
    </p>

    <div class="mt-6">
      <a href="https://t.me/VantaBotHub" target="_blank" class="block w-full bg-white text-black py-3 rounded-xl font-bold text-sm">Check Updates in Channel</a>
    </div>
  </div>
  <p class="text-center text-white/30 text-xs mt-6">© Vanta • Mine VANTA</p>
</div>
</body>
</html>
